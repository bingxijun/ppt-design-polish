<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800"><rect width="1600" height="800" fill="#F4F0E8"/><g font-family="Arial, Hiragino Sans GB, sans-serif" fill="#292521"><text x="55" y="82" font-size="41" font-weight="700">Design decisions you can inspect</text><text x="58" y="130" font-size="26" fill="#6E655C">把打样、选稿与返工，落实到真实页面和可复查证据</text><path d="M55 169H1545" stroke="#CFC5B9"/><text x="55" y="270" font-size="49" fill="#8D3927">01</text><text x="55" y="330" font-size="30" font-weight="700">Read</text><text x="55" y="370" font-size="24">编辑材料</text><path d="M55 400h215" stroke="#CFC5B9"/><text x="55" y="442" font-size="15" fill="#6E655C">Audience, claims, conditions</text><text x="55" y="476" font-size="17" fill="#6E655C">受众、主张与必要条件</text><path d="M160 253h112m-8-5 8 5-8 5" fill="none" stroke="#CFC5B9" stroke-width="2"/><text x="305" y="270" font-size="49" fill="#8D3927">02</text><text x="305" y="330" font-size="30" font-weight="700">Proof</text><text x="305" y="370" font-size="24">制作样页</text><path d="M305 400h215" stroke="#CFC5B9"/><text x="305" y="442" font-size="15" fill="#6E655C">Same content, real exports</text><text x="305" y="476" font-size="17" fill="#6E655C">同一内容，真实导出</text><path d="M410 253h112m-8-5 8 5-8 5" fill="none" stroke="#CFC5B9" stroke-width="2"/><text x="555" y="270" font-size="49" fill="#8D3927">03</text><text x="555" y="330" font-size="30" font-weight="700">Select</text><text x="555" y="370" font-size="24">看图选稿</text><path d="M555 400h215" stroke="#CFC5B9"/><text x="555" y="442" font-size="15" fill="#6E655C">Record strengths &amp; tradeoffs</text><text x="555" y="476" font-size="17" fill="#6E655C">记录候选优势与取舍</text><path d="M660 253h112m-8-5 8 5-8 5" fill="none" stroke="#CFC5B9" stroke-width="2"/><text x="805" y="270" font-size="49" fill="#8D3927">04</text><text x="805" y="330" font-size="30" font-weight="700">Build</text><text x="805" y="370" font-size="24">扩展整稿</text><path d="M805 400h215" stroke="#CFC5B9"/><text x="805" y="442" font-size="15" fill="#6E655C">Native text, charts &amp; tables</text><text x="805" y="476" font-size="17" fill="#6E655C">原生文字、图表与表格</text><path d="M910 253h112m-8-5 8 5-8 5" fill="none" stroke="#CFC5B9" stroke-width="2"/><text x="1055" y="270" font-size="49" fill="#8D3927">05</text><text x="1055" y="330" font-size="30" font-weight="700">Critique</text><text x="1055" y="370" font-size="24">定位返工</text><path d="M1055 400h215" stroke="#CFC5B9"/><text x="1055" y="442" font-size="15" fill="#6E655C">Locate, edit, re-render</text><text x="1055" y="476" font-size="17" fill="#6E655C">指出位置、改源稿、复查</text><path d="M1160 253h112m-8-5 8 5-8 5" fill="none" stroke="#CFC5B9" stroke-width="2"/><text x="1305" y="270" font-size="49" fill="#8D3927">06</text><text x="1305" y="330" font-size="30" font-weight="700">Deliver</text><text x="1305" y="370" font-size="24">检查交付</text><path d="M1305 400h215" stroke="#CFC5B9"/><text x="1305" y="442" font-size="15" fill="#6E655C">Current evidence &amp; reviews</text><text x="1305" y="476" font-size="17" fill="#6E655C">当前文件、证据与复查</text><path d="M1160 510v35H910v-25m-5 8 5-8 5 8" fill="none" stroke="#8D3927" stroke-width="2"/><text x="55" y="550" font-size="17" fill="#8D3927">Revise the source, then inspect again / 修改源稿后再看成品</text><rect x="55" y="600" width="1490" height="140" fill="#292521"/><g fill="#F4F0E8"><text x="82" y="641" font-size="21">Evidence validates file correspondence. Visual judgment remains the reviewer’s responsibility.</text><text x="82" y="680" font-size="22">证据检查对应关系，审美判断仍需真实看图；独立人工盲评单独记录，空白结果保持待评审。</text><text x="82" y="715" font-size="15" fill="#DDD3C5">PPT DESIGN &amp; POLISH 4.1 — no aesthetic scores or universal success claims</text></g></g></svg>