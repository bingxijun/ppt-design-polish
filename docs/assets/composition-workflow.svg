<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720"><rect width="1600" height="720" fill="#F5F9F8"/><g font-family="Arial, Hiragino Sans GB, sans-serif"><text x="70" y="90" font-size="42" fill="#183B40" font-weight="700">From announcement to presentation</text><text x="72" y="138" font-size="25" fill="#688084">从完整文告，到统一设计的可编辑演示稿</text><path d="M70 185H1530" stroke="#CDDDDD"/><text x="70" y="228" font-size="15" fill="#28747A" letter-spacing="2">PPT DESIGN &amp; POLISH 3.0</text><text x="70" y="325" font-size="62" fill="#28747A">01</text><text x="70" y="385" font-size="29" fill="#183B40" font-weight="700">Read</text><text x="70" y="425" font-size="22" fill="#183B40">通读文告</text><path d="M70 457H320" stroke="#CDDDDD"/><text x="70" y="500" font-size="16" fill="#688084">Facts, units, conditions</text><text x="70" y="533" font-size="16" fill="#688084">事实、单位与限定条件</text><path d="M175 304H324m-8-5 8 5-8 5" fill="none" stroke="#CDDDDD" stroke-width="2"/><text x="370" y="325" font-size="62" fill="#28747A">02</text><text x="370" y="385" font-size="29" fill="#183B40" font-weight="700">Arrange</text><text x="370" y="425" font-size="22" fill="#183B40">安排叙事</text><path d="M370 457H620" stroke="#CDDDDD"/><text x="370" y="500" font-size="16" fill="#688084">Claims become page roles</text><text x="370" y="533" font-size="16" fill="#688084">按含义归组为页面任务</text><path d="M475 304H624m-8-5 8 5-8 5" fill="none" stroke="#CDDDDD" stroke-width="2"/><text x="670" y="325" font-size="62" fill="#28747A">03</text><text x="670" y="385" font-size="29" fill="#183B40" font-weight="700">Direct</text><text x="670" y="425" font-size="22" fill="#183B40">建立视觉</text><path d="M670 457H920" stroke="#CDDDDD"/><text x="670" y="500" font-size="16" fill="#688084">Reference, photos, typography</text><text x="670" y="533" font-size="16" fill="#688084">参考、配图与字体层级</text><path d="M775 304H924m-8-5 8 5-8 5" fill="none" stroke="#CDDDDD" stroke-width="2"/><text x="970" y="325" font-size="62" fill="#28747A">04</text><text x="970" y="385" font-size="29" fill="#183B40" font-weight="700">Compose</text><text x="970" y="425" font-size="22" fill="#183B40">原生编排</text><path d="M970 457H1220" stroke="#CDDDDD"/><text x="970" y="500" font-size="16" fill="#688084">Layouts, pagination, editable data</text><text x="970" y="533" font-size="16" fill="#688084">版式、分页与可编辑数据</text><path d="M1075 304H1224m-8-5 8 5-8 5" fill="none" stroke="#CDDDDD" stroke-width="2"/><text x="1270" y="325" font-size="62" fill="#28747A">05</text><text x="1270" y="385" font-size="29" fill="#183B40" font-weight="700">Inspect</text><text x="1270" y="425" font-size="22" fill="#183B40">实看成品</text><path d="M1270 457H1520" stroke="#CDDDDD"/><text x="1270" y="500" font-size="16" fill="#688084">Render, compare, repair</text><text x="1270" y="533" font-size="16" fill="#688084">导出、对照与修正</text><rect x="70" y="592" width="1460" height="66" fill="#073B46"/><text x="94" y="632" font-size="18" fill="#FFFFFF">Traceable source → claim → page</text><text x="660" y="632" font-size="18" fill="#C6DCDB">原文、事实与页面可追溯；语义与审美仍须复查</text></g></svg>