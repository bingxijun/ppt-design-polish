<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560"><rect width="1600" height="560" fill="#F4F3EE"/><g font-family="Arial, Hiragino Sans GB, sans-serif" fill="#202623"><text x="60" y="68" font-size="34">A whole-page recipe / 封装整页视觉效果</text><text x="60" y="112" font-size="22" fill="#606660">Source meaning → page appearance → real assets → editable export</text><text x="60" y="148" font-size="22" fill="#606660">内容含义 → 页面样貌 → 实际素材 → 可编辑交付</text><path d="M60 190H1540" stroke="#CBCFC8"/><text x="60" y="273" fill="#B0772A" font-size="42">01</text><text x="60" y="333" font-size="24">READ / 理解</text><text x="60" y="391" font-size="20">Story + grounded data</text><text x="60" y="431" font-size="22" fill="#606660">叙事、数值、限定条件</text><text x="440" y="273" fill="#B0772A" font-size="42">02</text><text x="440" y="333" font-size="24">DIRECT / 设计</text><text x="440" y="391" font-size="20">Type + chart + image + labels</text><text x="440" y="431" font-size="22" fill="#606660">字体、图形、配图、标注</text><text x="820" y="273" fill="#B0772A" font-size="42">03</text><text x="820" y="333" font-size="24">BUILD / 编排</text><text x="820" y="391" font-size="20">Native text, data and relations</text><text x="820" y="431" font-size="22" fill="#606660">原生文字、数据与关系</text><text x="1200" y="273" fill="#B0772A" font-size="42">04</text><text x="1200" y="333" font-size="24">INSPECT / 看图</text><text x="1200" y="391" font-size="20">Revise the actual exported page</text><text x="1200" y="431" font-size="22" fill="#606660">检查实际导出并修改</text><text x="60" y="511" font-size="20" fill="#606660">Image tools must execute requests. A prompt file is not an image. / 配图必须实际生成或取图，提示词本身不算交付。</text></g></svg>