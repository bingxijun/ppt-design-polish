<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430"><rect width="1600" height="430" fill="#F4F3EE"/><g font-family="Arial, Hiragino Sans GB, sans-serif" fill="#202623"><text x="55" y="60" font-size="31" font-weight="bold">Content becomes a visual treatment / 内容自动转为视觉构成</text><text x="55" y="103" font-size="20" fill="#5B5F5C">One user request; the agent handles chart choice, typography, imagery and matched symbols.</text><text x="55" y="137" font-size="20" fill="#5B5F5C">用户给材料，agent 处理图形选择、字体层级、配图与统一图标。</text><text x="55" y="218" font-size="16" fill="#B0772A">01 / READ</text><text x="55" y="264" font-size="29" font-weight="bold">理解材料</text><text x="55" y="316" font-size="18">Facts, units, conditions</text><text x="55" y="350" font-size="20" fill="#5B5F5C">事实、单位、条件</text><path d="M297 249h40m-8-6 8 6-8 6" stroke="#AEB3AA" stroke-width="1.5" fill="none"/><text x="365" y="218" font-size="16" fill="#B0772A">02 / MATCH</text><text x="365" y="264" font-size="29" font-weight="bold">选择表达</text><text x="365" y="316" font-size="18">Chart or relationship</text><text x="365" y="350" font-size="20" fill="#5B5F5C">数据图形、内容关系</text><path d="M607 249h40m-8-6 8 6-8 6" stroke="#AEB3AA" stroke-width="1.5" fill="none"/><text x="675" y="218" font-size="16" fill="#B0772A">03 / SOURCE</text><text x="675" y="264" font-size="29" font-weight="bold">准备素材</text><text x="675" y="316" font-size="18">Image briefs + icons</text><text x="675" y="350" font-size="20" fill="#5B5F5C">构图提示、配图、图标</text><path d="M917 249h40m-8-6 8 6-8 6" stroke="#AEB3AA" stroke-width="1.5" fill="none"/><text x="985" y="218" font-size="16" fill="#B0772A">04 / COMPOSE</text><text x="985" y="264" font-size="29" font-weight="bold">自动编排</text><text x="985" y="316" font-size="18">Type, space, hierarchy</text><text x="985" y="350" font-size="20" fill="#5B5F5C">字体、留白、主次</text><path d="M1227 249h40m-8-6 8 6-8 6" stroke="#AEB3AA" stroke-width="1.5" fill="none"/><text x="1295" y="218" font-size="16" fill="#B0772A">05 / REVIEW</text><text x="1295" y="264" font-size="29" font-weight="bold">导出后复查</text><text x="1295" y="316" font-size="18">Inspect actual pages</text><text x="1295" y="350" font-size="20" fill="#5B5F5C">逐页看图并修改</text></g></svg>