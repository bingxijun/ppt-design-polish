name: release-package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('package.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v'+version, 'Tag and package version differ'
          PY
      - run: python3 scripts/package_release.py --output-dir release-assets
      - name: Upload portable skill and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/ppt-design-polish.zip release-assets/ppt-design-polish.zip.sha256 --repo "$GITHUB_REPOSITORY"
